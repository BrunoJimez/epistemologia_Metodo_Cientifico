<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Anatomia em camadas de uma teoria científica</title>
  <desc id="desc">Oito camadas da ontologia à evidência, conectadas por interpretação, derivação e medição, com crítica transversal.</desc>
  <defs><style>.bg{fill:#f8fafc}.layer{stroke:#fff;stroke-width:3;rx:12}.t{font:700 20px Arial;fill:#fff}.s{font:16px Arial;fill:#eef6ff}.side{fill:#fff;stroke:#c2410c;stroke-width:3;rx:14}.st{font:700 18px Arial;fill:#9a3412}.ss{font:15px Arial;fill:#7c2d12}.a{stroke:#c2410c;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#c2410c"/></marker></defs>
  <rect class="bg" width="1200" height="760"/><text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#173f6b">ANATOMIA DE UMA TEORIA CIENTÍFICA</text>
  <g transform="translate(120 75)"><rect class="layer" fill="#173f6b" width="680" height="70"/><text class="t" x="24" y="29">1. Ontologia e sistema-alvo</text><text class="s" x="24" y="53">que entidades/processos a teoria representa?</text></g>
  <g transform="translate(120 145)"><rect class="layer" fill="#1e5a7d" width="680" height="70"/><text class="t" x="24" y="29">2. Conceitos e definições</text><text class="s" x="24" y="53">grandezas, categorias e regras de uso</text></g>
  <g transform="translate(120 215)"><rect class="layer" fill="#0f766e" width="680" height="70"/><text class="t" x="24" y="29">3. Princípios e hipóteses</text><text class="s" x="24" y="53">conservação, simetria, mecanismos, rivais</text></g>
  <g transform="translate(120 285)"><rect class="layer" fill="#15803d" width="680" height="70"/><text class="t" x="24" y="29">4. Estrutura matemática</text><text class="s" x="24" y="53">equações, parâmetros, condições e derivação</text></g>
  <g transform="translate(120 355)"><rect class="layer" fill="#7c3aed" width="680" height="70"/><text class="t" x="24" y="29">5. Modelos específicos</text><text class="s" x="24" y="53">idealizações para sistemas e regimes concretos</text></g>
  <g transform="translate(120 425)"><rect class="layer" fill="#a855f7" width="680" height="70"/><text class="t" x="24" y="29">6. Ponte de medição</text><text class="s" x="24" y="53">procedimentos, instrumentos, calibração, unidades</text></g>
  <g transform="translate(120 495)"><rect class="layer" fill="#c2410c" width="680" height="70"/><text class="t" x="24" y="29">7. Previsões e retrodicções</text><text class="s" x="24" y="53">resultados observáveis e domínio de validade</text></g>
  <g transform="translate(120 565)"><rect class="layer" fill="#9a3412" width="680" height="70"/><text class="t" x="24" y="29">8. Evidência e incerteza</text><text class="s" x="24" y="53">dados, estatística, alternativas e limites</text></g>
  <g transform="translate(860 125)"><rect class="side" width="280" height="440"/><text class="st" x="140" y="38" text-anchor="middle">CONTROLES TRANSVERSAIS</text><text class="ss" x="24" y="88">• consistência lógica</text><text class="ss" x="24" y="125">• análise dimensional</text><text class="ss" x="24" y="162">• casos-limite</text><text class="ss" x="24" y="199">• verificação do código</text><text class="ss" x="24" y="236">• resíduos e rivais</text><text class="ss" x="24" y="273">• crítica comunitária</text><text class="ss" x="24" y="310">• replicação independente</text><text class="ss" x="24" y="347">• revisão da teoria</text><path class="a" d="M140 375v42"/></g>
  <path class="a" d="M800 110h50"/><path class="a" d="M850 250H810"/><path class="a" d="M850 390H810"/><path class="a" d="M850 530H810"/>
  <text x="460" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#334e68">Uma teoria não é uma equação isolada: é uma arquitetura com pontes e pontos de falha.</text>
</svg>
