<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Ponte entre equação e realidade</title>
  <desc id="desc">Sete nós ligam símbolo, grandeza, procedimento, instrumento, indicação, dado e inferência, com calibração e incerteza atravessando a cadeia.</desc>
  <defs><style>.bg{fill:#fffdfa}.node{fill:#fff;stroke:#173f6b;stroke-width:3;rx:14}.t{font:700 19px Arial;fill:#173f6b}.s{font:15px Arial;fill:#334e68}.a{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#m)}.back{stroke:#c2410c;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#o)}.band{fill:#e7f5f2;stroke:#0f766e;stroke-width:2;rx:16}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0f766e"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#c2410c"/></marker></defs>
  <rect class="bg" width="1200" height="650"/><text x="600" y="43" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#173f6b">COMO UM SÍMBOLO GANHA SIGNIFICADO EMPÍRICO</text>
  <g transform="translate(35 120)"><rect class="node" width="145" height="120"/><text class="t" x="72" y="35" text-anchor="middle">SÍMBOLO</text><text class="s" x="72" y="67" text-anchor="middle">t, s, T, E</text><text class="s" x="72" y="91" text-anchor="middle">em uma equação</text></g>
  <g transform="translate(200 120)"><rect class="node" width="145" height="120"/><text class="t" x="72" y="35" text-anchor="middle">GRANDEZA</text><text class="s" x="72" y="67" text-anchor="middle">o que varia?</text><text class="s" x="72" y="91" text-anchor="middle">qual unidade?</text></g>
  <g transform="translate(365 120)"><rect class="node" width="145" height="120"/><text class="t" x="72" y="35" text-anchor="middle">PROCEDIMENTO</text><text class="s" x="72" y="67" text-anchor="middle">eventos e regra</text><text class="s" x="72" y="91" text-anchor="middle">operacional</text></g>
  <g transform="translate(530 120)"><rect class="node" width="145" height="120"/><text class="t" x="72" y="35" text-anchor="middle">INSTRUMENTO</text><text class="s" x="72" y="67" text-anchor="middle">sensor, escala</text><text class="s" x="72" y="91" text-anchor="middle">e calibração</text></g>
  <g transform="translate(695 120)"><rect class="node" width="145" height="120"/><text class="t" x="72" y="35" text-anchor="middle">INDICAÇÃO</text><text class="s" x="72" y="67" text-anchor="middle">quadro, tensão,</text><text class="s" x="72" y="91" text-anchor="middle">marca ou leitura</text></g>
  <g transform="translate(860 120)"><rect class="node" width="145" height="120"/><text class="t" x="72" y="35" text-anchor="middle">DADO</text><text class="s" x="72" y="67" text-anchor="middle">valor + unidade</text><text class="s" x="72" y="91" text-anchor="middle">+ metadados</text></g>
  <g transform="translate(1025 120)"><rect class="node" width="145" height="120"/><text class="t" x="72" y="35" text-anchor="middle">INFERÊNCIA</text><text class="s" x="72" y="67" text-anchor="middle">parâmetro, teste</text><text class="s" x="72" y="91" text-anchor="middle">e interpretação</text></g>
  <path class="a" d="M180 180h12"/><path class="a" d="M345 180h12"/><path class="a" d="M510 180h12"/><path class="a" d="M675 180h12"/><path class="a" d="M840 180h12"/><path class="a" d="M1005 180h12"/>
  <g transform="translate(190 310)"><rect class="band" width="820" height="80"/><text x="410" y="31" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#0f766e">RASTREABILIDADE, CALIBRAÇÃO E INCERTEZA</text><text x="410" y="57" text-anchor="middle" font-family="Arial" font-size="16" fill="#285e61">qualificam as ligações; não são um adorno anexado ao resultado</text></g>
  <path class="back" d="M1095 240v230H600V398"/><text x="820" y="498" text-anchor="middle" font-family="Arial" font-size="17" fill="#9a3412"><tspan x="820">resíduo pode revelar problema</tspan><tspan x="820" dy="22">no instrumento ou na definição</tspan></text>
  <path class="back" d="M1080 240v330H280V248"/><text x="490" y="603" font-family="Arial" font-size="17" fill="#9a3412">crítica da interpretação pode exigir redefinir a grandeza</text>
</svg>
