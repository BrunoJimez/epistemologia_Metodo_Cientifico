<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Framework preenchido pelo plano inclinado</title>
  <desc id="desc">Do movimento da esfera à comparação entre modelos linear e quadrático, incluindo vídeo, incerteza, resíduos e replicação.</desc>
  <defs><style>.bg{fill:#fffdfa}.box{fill:#fff;stroke:#0f766e;stroke-width:3;rx:13}.k{font:700 17px Arial;fill:#173f6b}.v{font:15px Arial;fill:#263b50}.a{stroke:#c2410c;stroke-width:4;fill:none;marker-end:url(#m)}.r{stroke:#64748b;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#g)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#c2410c"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="800"/><text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#173f6b">PLANO INCLINADO: DA PERGUNTA À REPLICAÇÃO</text>
  <g transform="translate(45 78)"><rect class="box" width="255" height="100"/><text class="k" x="16" y="29">1. Fenômeno e pergunta</text><text class="v" x="16" y="57">A esfera acelera?</text><text class="v" x="16" y="81">s é linear em t ou t²?</text></g>
  <g transform="translate(345 78)"><rect class="box" width="255" height="100"/><text class="k" x="16" y="29">2. Definições</text><text class="v" x="16" y="57">s: centro ao longo da rampa</text><text class="v" x="16" y="81">t: quadros / fps</text></g>
  <g transform="translate(645 78)"><rect class="box" width="255" height="100"/><text class="k" x="16" y="29">3. Hipóteses rivais</text><text class="v" x="16" y="57">H1: s = b0 + b1 t</text><text class="v" x="16" y="81">H2: s = b0 + b2 t²</text></g>
  <g transform="translate(945 78)"><rect class="box" width="210" height="100"/><text class="k" x="16" y="29">4. Idealização</text><text class="v" x="16" y="57">rampa reta;</text><text class="v" x="16" y="81">rolar sem escorregar</text></g>
  <g transform="translate(945 245)"><rect class="box" width="210" height="100"/><text class="k" x="16" y="29">5. Derivação</text><text class="v" x="16" y="57">a constante;</text><text class="v" x="16" y="81">s = s0+v0t+½at²</text></g>
  <g transform="translate(645 245)"><rect class="box" width="255" height="100"/><text class="k" x="16" y="29">6. Predição</text><text class="v" x="16" y="57">repouso: s proporcional a t²</text><text class="v" x="16" y="81">a esfera: 5/7 g sen(alpha)</text></g>
  <g transform="translate(345 245)"><rect class="box" width="255" height="100"/><text class="k" x="16" y="29">7. Desenho</text><text class="v" x="16" y="57">5 posições x 8 repetições</text><text class="v" x="16" y="81">regras pré-registradas</text></g>
  <g transform="translate(45 245)"><rect class="box" width="255" height="100"/><text class="k" x="16" y="29">8. Instrumento</text><text class="v" x="16" y="57">vídeo 60 fps + escala</text><text class="v" x="16" y="81">ou relógio de água</text></g>
  <g transform="translate(45 412)"><rect class="box" width="255" height="100"/><text class="k" x="16" y="29">9. Dados</text><text class="v" x="16" y="57">brutos + metadados</text><text class="v" x="16" y="81">exclusões preservadas</text></g>
  <g transform="translate(345 412)"><rect class="box" width="255" height="100"/><text class="k" x="16" y="29">10. Incerteza</text><text class="v" x="16" y="57">repetibilidade + resolução</text><text class="v" x="16" y="81">perspectiva e liberação</text></g>
  <g transform="translate(645 412)"><rect class="box" width="255" height="100"/><text class="k" x="16" y="29">11. Confronto</text><text class="v" x="16" y="57">regressão e resíduos</text><text class="v" x="16" y="81">RMSE linear x quadrático</text></g>
  <g transform="translate(945 412)"><rect class="box" width="210" height="100"/><text class="k" x="16" y="29">12. Replicação</text><text class="v" x="16" y="57">ângulos, esferas,</text><text class="v" x="16" y="81">operadores e laboratórios</text></g>
  <path class="a" d="M300 128h35"/><path class="a" d="M600 128h35"/><path class="a" d="M900 128h35"/><path class="a" d="M1050 178v57"/><path class="a" d="M945 295h-35"/><path class="a" d="M645 295h-35"/><path class="a" d="M345 295h-35"/><path class="a" d="M172 345v57"/><path class="a" d="M300 462h35"/><path class="a" d="M600 462h35"/><path class="a" d="M900 462h35"/>
  <path class="r" d="M1050 512v160H770V522"/><text x="815" y="704" font-family="Arial" font-size="17" fill="#475569">resíduo estruturado: revisar modelo</text>
  <path class="r" d="M1020 512v230H170V522"/><text x="430" y="768" font-family="Arial" font-size="17" fill="#475569">divergência entre operadores: revisar instrumento e procedimento</text>
  <rect x="375" y="565" width="450" height="70" rx="14" fill="#fff4e8" stroke="#c2410c" stroke-width="2"/><text x="600" y="594" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#9a3412">CONCLUSÃO LIMITADA</text><text x="600" y="619" text-anchor="middle" font-family="Arial" font-size="16" fill="#7c2d12">melhor adequação nestas condições, não prova universal</text>
</svg>
