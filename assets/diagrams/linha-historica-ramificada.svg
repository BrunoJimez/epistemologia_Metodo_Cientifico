<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Linha histórica ramificada da ciência matemática</title>
  <desc id="desc">Tradições mesopotâmicas, egípcias, gregas, indianas, chinesas e em árabe convergem parcialmente com universidades, instrumentos, impressão, cálculo e estatística.</desc>
  <defs><style>.bg{fill:#fffdfa}.node{fill:#fff;stroke:#173f6b;stroke-width:2.5;rx:12}.era{fill:#173f6b}.et{font:700 18px Arial;fill:#fff}.t{font:600 16px Arial;fill:#172033}.s{font:14px Arial;fill:#334e68}.line{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#m)}.cross{stroke:#c2410c;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#o)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0f766e"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#c2410c"/></marker></defs>
  <rect class="bg" width="1200" height="820"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#173f6b">HISTÓRIA RAMIFICADA: TÉCNICAS, TEXTOS E INSTITUIÇÕES</text>
  <g transform="translate(35 70)"><rect class="era" width="170" height="48" rx="10"/><text class="et" x="85" y="31" text-anchor="middle">ANTES DE 500 a.C.</text></g>
  <g transform="translate(240 58)"><rect class="node" width="260" height="82"/><text class="t" x="18" y="29">Mesopotâmia</text><text class="s" x="18" y="54">fichas, escrita, tabelas, céu</text></g>
  <g transform="translate(540 58)"><rect class="node" width="260" height="82"/><text class="t" x="18" y="29">Egito</text><text class="s" x="18" y="54">medida, papiros, administração</text></g>
  <g transform="translate(840 58)"><rect class="node" width="315" height="82"/><text class="t" x="18" y="29">Cognição e registros diversos</text><text class="s" x="18" y="54">sem origem única identificável</text></g>
  <g transform="translate(35 210)"><rect class="era" width="170" height="48" rx="10"/><text class="et" x="85" y="31" text-anchor="middle">500 a.C.–700</text></g>
  <g transform="translate(240 190)"><rect class="node" width="260" height="92"/><text class="t" x="18" y="29">Tradições gregas</text><text class="s" x="18" y="54">demonstração, geometria,</text><text class="s" x="18" y="75">mecânica e astronomia</text></g>
  <g transform="translate(540 190)"><rect class="node" width="260" height="92"/><text class="t" x="18" y="29">Tradições indianas</text><text class="s" x="18" y="54">algoritmos, zero,</text><text class="s" x="18" y="75">astronomia e séries</text></g>
  <g transform="translate(840 190)"><rect class="node" width="315" height="92"/><text class="t" x="18" y="29">Tradições chinesas</text><text class="s" x="18" y="54">procedimentos, comentários,</text><text class="s" x="18" y="75">astronomia e engenharia</text></g>
  <g transform="translate(35 352)"><rect class="era" width="170" height="48" rx="10"/><text class="et" x="85" y="31" text-anchor="middle">700–1450</text></g>
  <g transform="translate(240 330)"><rect class="node" width="330" height="96"/><text class="t" x="18" y="29">Ciências em árabe</text><text class="s" x="18" y="54">tradução e transformação:</text><text class="s" x="18" y="75">álgebra, óptica, observatórios</text></g>
  <g transform="translate(625 330)"><rect class="node" width="260" height="96"/><text class="t" x="18" y="29">Universidades latinas</text><text class="s" x="18" y="54">escolástica, Merton,</text><text class="s" x="18" y="75">Oresme e comentários</text></g>
  <g transform="translate(930 330)"><rect class="node" width="225" height="96"/><text class="t" x="18" y="29">Oficinas e comércio</text><text class="s" x="18" y="54">instrumentos, mapas,</text><text class="s" x="18" y="75">contas e navegação</text></g>
  <g transform="translate(35 500)"><rect class="era" width="170" height="48" rx="10"/><text class="et" x="85" y="31" text-anchor="middle">1450–1750</text></g>
  <g transform="translate(240 478)"><rect class="node" width="280" height="96"/><text class="t" x="18" y="29">Impressão e astronomia</text><text class="s" x="18" y="54">Copérnico, Tycho,</text><text class="s" x="18" y="75">Kepler, redes de dados</text></g>
  <g transform="translate(565 478)"><rect class="node" width="280" height="96"/><text class="t" x="18" y="29">Experimento matemático</text><text class="s" x="18" y="54">Galileu, óptica, relógios</text><text class="s" x="18" y="75">e academias</text></g>
  <g transform="translate(890 478)"><rect class="node" width="265" height="96"/><text class="t" x="18" y="29">Cálculo e mecânica</text><text class="s" x="18" y="54">Newton, Leibniz e</text><text class="s" x="18" y="75">correspondentes</text></g>
  <g transform="translate(35 650)"><rect class="era" width="170" height="48" rx="10"/><text class="et" x="85" y="31" text-anchor="middle">1750–2026</text></g>
  <g transform="translate(240 628)"><rect class="node" width="270" height="108"/><text class="t" x="18" y="29">Calor, campos, estatística</text><text class="s" x="18" y="54">Fourier, Maxwell,</text><text class="s" x="18" y="75">probabilidade e inferência</text></g>
  <g transform="translate(555 628)"><rect class="node" width="270" height="108"/><text class="t" x="18" y="29">Relatividade e quanta</text><text class="s" x="18" y="54">Einstein, Grossmann,</text><text class="s" x="18" y="75">Hilbert e novas medições</text></g>
  <g transform="translate(870 628)"><rect class="node" width="285" height="108"/><text class="t" x="18" y="29">Computação, ciência aberta, IA</text><text class="s" x="18" y="54">simulação, Lean, dados,</text><text class="s" x="18" y="75">replicação e prova assistida</text></g>
  <path class="line" d="M370 140v40"/><path class="line" d="M670 140v40"/><path class="line" d="M997 140v40"/>
  <path class="cross" d="M370 282v38"/><path class="cross" d="M670 282L450 320"/><path class="cross" d="M997 282L520 320"/><path class="cross" d="M450 426L350 468"/><path class="cross" d="M730 426L690 468"/><path class="cross" d="M1040 426L985 468"/>
  <path class="line" d="M380 574v44"/><path class="line" d="M705 574L690 618"/><path class="line" d="M1020 574v44"/>
  <text x="600" y="785" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">As setas indicam conexões documentadas ou famílias de circulação; não uma única escada civilizacional.</text>
</svg>
