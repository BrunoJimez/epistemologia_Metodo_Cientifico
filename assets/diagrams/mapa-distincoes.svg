<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de distinções epistêmicas</title>
  <desc id="desc">Cinco colunas separam verdade lógica, matemática, adequação empírica, precisão estatística e objetividade comunitária.</desc>
  <defs><style>.bg{fill:#f8fafc}.head{font:700 20px Arial;fill:#fff}.body{font:16px Arial;fill:#172033}.q{font:700 16px Arial;fill:#173f6b}.card{fill:#fff;stroke:#9fb3c4;stroke-width:2}.h1{fill:#173f6b}.h2{fill:#0f766e}.h3{fill:#7c3aed}.h4{fill:#c2410c}.h5{fill:#475569}</style></defs>
  <rect class="bg" width="1200" height="700"/><text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#173f6b">CINCO PERGUNTAS QUE NÃO DEVEM SER CONFUNDIDAS</text>
  <g transform="translate(35 80)"><rect class="card" width="210" height="550" rx="14"/><rect class="h1" width="210" height="76" rx="14"/><text class="head" x="105" y="31" text-anchor="middle">VERDADE</text><text class="head" x="105" y="57" text-anchor="middle">LÓGICA</text><text class="q" x="16" y="113">Pergunta</text><text class="body" x="16" y="141">A conclusão decorre</text><text class="body" x="16" y="165">das premissas?</text><text class="q" x="16" y="215">Controle</text><text class="body" x="16" y="243">forma inferencial</text><text class="q" x="16" y="293">Não garante</text><text class="body" x="16" y="321">premissas verdadeiras</text><text class="body" x="16" y="345">ou mundo adequado</text><text class="q" x="16" y="395">Exemplo</text><text class="body" x="16" y="423">silogismo válido</text></g>
  <g transform="translate(265 80)"><rect class="card" width="210" height="550" rx="14"/><rect class="h2" width="210" height="76" rx="14"/><text class="head" x="105" y="31" text-anchor="middle">VERDADE</text><text class="head" x="105" y="57" text-anchor="middle">MATEMÁTICA</text><text class="q" x="16" y="113">Pergunta</text><text class="body" x="16" y="141">O teorema segue</text><text class="body" x="16" y="165">no sistema?</text><text class="q" x="16" y="215">Controle</text><text class="body" x="16" y="243">prova e axiomas</text><text class="q" x="16" y="293">Não garante</text><text class="body" x="16" y="321">aplicação ao alvo</text><text class="body" x="16" y="345">natural</text><text class="q" x="16" y="395">Exemplo</text><text class="body" x="16" y="423">teorema de Euclides</text></g>
  <g transform="translate(495 80)"><rect class="card" width="210" height="550" rx="14"/><rect class="h3" width="210" height="76" rx="14"/><text class="head" x="105" y="31" text-anchor="middle">ADEQUAÇÃO</text><text class="head" x="105" y="57" text-anchor="middle">EMPÍRICA</text><text class="q" x="16" y="113">Pergunta</text><text class="body" x="16" y="141">Previsões encontram</text><text class="body" x="16" y="165">dados no domínio?</text><text class="q" x="16" y="215">Controle</text><text class="body" x="16" y="243">medição e rivais</text><text class="q" x="16" y="293">Não garante</text><text class="body" x="16" y="321">unicidade ou verdade</text><text class="body" x="16" y="345">final da teoria</text><text class="q" x="16" y="395">Exemplo</text><text class="body" x="16" y="423">resíduos sem padrão</text></g>
  <g transform="translate(725 80)"><rect class="card" width="210" height="550" rx="14"/><rect class="h4" width="210" height="76" rx="14"/><text class="head" x="105" y="31" text-anchor="middle">PRECISÃO</text><text class="head" x="105" y="57" text-anchor="middle">ESTATÍSTICA</text><text class="q" x="16" y="113">Pergunta</text><text class="body" x="16" y="141">Quanta variação e</text><text class="body" x="16" y="165">incerteza?</text><text class="q" x="16" y="215">Controle</text><text class="body" x="16" y="243">modelo de dados</text><text class="q" x="16" y="293">Não garante</text><text class="body" x="16" y="321">ausência de viés ou</text><text class="body" x="16" y="345">importância prática</text><text class="q" x="16" y="395">Exemplo</text><text class="body" x="16" y="423">intervalo e RMSE</text></g>
  <g transform="translate(955 80)"><rect class="card" width="210" height="550" rx="14"/><rect class="h5" width="210" height="76" rx="14"/><text class="head" x="105" y="31" text-anchor="middle">OBJETIVIDADE</text><text class="head" x="105" y="57" text-anchor="middle">COMUNITÁRIA</text><text class="q" x="16" y="113">Pergunta</text><text class="body" x="16" y="141">O resultado resiste</text><text class="body" x="16" y="165">à crítica plural?</text><text class="q" x="16" y="215">Controle</text><text class="body" x="16" y="243">transparência e réplica</text><text class="q" x="16" y="293">Não garante</text><text class="body" x="16" y="321">comunidade livre</text><text class="body" x="16" y="345">de erro compartilhado</text><text class="q" x="16" y="395">Exemplo</text><text class="body" x="16" y="423">laboratórios independentes</text></g>
  <text x="600" y="668" text-anchor="middle" font-family="Arial" font-size="19" fill="#334e68">Uma afirmação científica forte precisa coordenar controles diferentes, não substituir um pelo outro.</text>
</svg>
